---
all:
  hosts:
    hypervisor:
      # Required for the MVP path (identity, baseline, security, kvm).
      # ansible_host is always an FQDN, never a static/DHCP-lease IP — set it
      # to the PERMANENT name (system_hostname's domain), not the cloud-init
      # bootstrap name. Until the identity role has run once and Phase 2.5's
      # DNS checkpoint confirms that name resolves, reach the host by
      # overriding on the command line instead of editing this file:
      #   ansible-playbook site.yml -e ansible_host=<bootstrap-fqdn>
      # See docs/hypervisor-deploy-runbook.md Phase 1/2/2.5.
      ansible_host: "<PERMANENT_FQDN>"
      system_hostname: "<HOSTNAME>"
      system_timezone: "<TIMEZONE>"

      # Only required if/when running the optional, deferred bridge/VLAN
      # migration (--tags networking; see docs/hypervisor-deploy-runbook.md
      # Phase 3). Omit these entirely for an MVP-only host.
      net_phys_iface: "<NIC_NAME>"
      net_bridge_name: "br0"
      net_server_vlan: <VLAN_ID>
      net_allowed_vlans: [<VLAN_ID>, <VLAN_ID>, <VLAN_ID>]
