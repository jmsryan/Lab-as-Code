---
- name: Hypervisor base configuration
  hosts: hypervisor
  become: true
  gather_facts: false
  roles:
    - identity
    - baseline
    - security
    # networkd is not listed here. It is a dependency of hypervisor-networking
    # (roles/hypervisor-networking/meta/main.yml), which passes it
    # networkd_stage_primary=false and networkd_apply=false so there is exactly
    # one cutover, owned by hypervisor-networking. Listing it here as well would
    # invoke it a second time with different parameters — Ansible only
    # deduplicates a role when its parameters match — and that second run would
    # stage a 10-<iface>.network that competes with the bridge config.
    #
    # Dependencies inherit the parent role's tags, so networkd carries the
    # networking tag exactly as hypervisor-networking does.
    #
    # No `never` tag: networking is in scope, and the goal is a single run that
    # brings the host up end to end. This stages the bridge config on every run.
    # The cutover stays gated on hypervisor_networking_apply (default false),
    # which is the actual safety mechanism — tags never were.
    - role: hypervisor-networking
      tags:
        - networking
    - role: kvm
      tags:
        - kvm
