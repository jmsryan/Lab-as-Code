---
# Bridge name for the hypervisor host
net_bridge_name: br0

# Physical NIC to enslave (must be set in host vars)
# net_phys_iface: eno1

# Untagged/PVID VLAN for the host itself (DHCP on bridge)
# net_server_vlan: 20

# Allowed VLANs on the bridge trunk (list of ints)
# net_allowed_vlans: [20, 30, 40]

# Whether to apply/restart systemd-networkd after staging
hypervisor_networking_apply: false

# Seconds before the dead-man switch fires and rolls back networking.
# Must be long enough to find the new IP, update inventory, and re-run site.yml.
hypervisor_networking_rollback_window: 600

# Whether to backup/cleanup existing networkd configs before staging
hypervisor_networking_cleanup: true
