---
# Configure a VLAN-aware Linux bridge and hand networking to systemd-networkd.
#
# Staging is unconditional and safe. The cutover is gated behind
# hypervisor_networking_apply — see defaults/main.yml.
#
# There is deliberately no automatic rollback. A dead-man switch was tried and
# removed: restoring an archive of /etc/systemd/network cannot undo the cutover,
# because stopping systemd-networkd does not delete the bridge and VLAN netdevs
# it created. The physical NIC stays enslaved, so handing it back to ifupdown
# produced a host running both stacks at once — an IP on a bridge port, which
# can never receive traffic — and that was harder to diagnose than an
# unreachable host. A timer that mutates the host while you are diagnosing it
# costs more than it saves when out-of-band console access is available.
# Recovery is a console job. See docs/hypervisor-deploy-runbook.md.

- name: Assert required hypervisor networking variables are defined
  ansible.builtin.assert:
    that:
      - net_phys_iface is defined
      - net_bridge_name is defined
      - net_server_vlan is defined
      - net_allowed_vlans is defined
    fail_msg: >
      Missing required variables. Define in host vars:
      net_phys_iface, net_bridge_name, net_server_vlan, net_allowed_vlans

- name: Normalize allowed VLAN list and ensure server VLAN is included
  ansible.builtin.set_fact:
    net_allowed_vlans_normalized: >-
      {{ (net_allowed_vlans + [net_server_vlan]) | map('int') | list | unique }}

- name: Sort allowed VLANs
  ansible.builtin.set_fact:
    net_allowed_vlans_sorted: "{{ net_allowed_vlans_normalized | sort }}"

- name: Resolve the physical NIC's MAC address
  # Pinned onto the bridge netdev (templates/bridge.netdev.j2) so the bridge
  # stops presenting a randomly generated address to DHCP. The networkd role
  # runs first as a dependency and gathers the network subset, so the fact is
  # already populated here. Fact keys replace dots and dashes in interface
  # names with underscores, so the raw inventory value cannot be used as a key.
  ansible.builtin.set_fact:
    net_phys_mac: >-
      {{ (ansible_facts[net_phys_iface | replace('.', '_') | replace('-', '_')]
          | default({})).macaddress | default('') }}

- name: Assert the physical NIC's MAC address was resolved
  # An empty MACAddress= renders a .netdev that systemd refuses to load, and
  # that failure would not surface until the cutover, with the host already
  # unreachable. Fail here instead, while nothing has been staged.
  ansible.builtin.assert:
    that:
      - net_phys_mac | length > 0
    fail_msg: >
      Could not read the MAC address of {{ net_phys_iface }} from gathered
      network facts. Check that net_phys_iface names a real interface on this
      host.

- name: Ensure /etc/systemd/network exists
  ansible.builtin.file:
    path: /etc/systemd/network
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Define networkd config paths
  ansible.builtin.set_fact:
    networkd_paths:
      bridge_netdev: "/etc/systemd/network/10-{{ net_bridge_name }}.netdev"
      bridge_network: "/etc/systemd/network/20-{{ net_bridge_name }}.network"
      vlan_netdev: "/etc/systemd/network/21-{{ net_bridge_name }}.{{ net_server_vlan }}.netdev"
      vlan_network: "/etc/systemd/network/22-{{ net_bridge_name }}.{{ net_server_vlan }}.network"
      phys_network: "/etc/systemd/network/30-{{ net_phys_iface }}.network"

- name: Define approved networkd config files
  ansible.builtin.set_fact:
    networkd_approved_files:
      - "{{ networkd_paths.bridge_netdev }}"
      - "{{ networkd_paths.vlan_netdev }}"
      - "{{ networkd_paths.bridge_network }}"
      - "{{ networkd_paths.vlan_network }}"
      - "{{ networkd_paths.phys_network }}"

- name: Find existing networkd config files
  ansible.builtin.find:
    paths: /etc/systemd/network
    patterns:
      - "*.network"
      - "*.netdev"
      - "*.link"
    file_type: file
  register: networkd_existing_files
  when:
    - hypervisor_networking_cleanup | bool

- name: List non-approved networkd config files
  ansible.builtin.set_fact:
    networkd_unapproved_files: >-
      {{ networkd_existing_files.files
         | rejectattr('path', 'in', networkd_approved_files)
         | list }}
  when:
    - hypervisor_networking_cleanup | bool

- name: Generate timestamp for networkd config backup
  ansible.builtin.command: date +%Y%m%d%H%M%S
  register: hypervisor_networkd_backup_ts
  changed_when: false
  when:
    - hypervisor_networking_cleanup | bool
    - networkd_unapproved_files | length > 0

- name: Backup /etc/systemd/network before cleanup
  ansible.builtin.shell: |
    set -euo pipefail
    tar -C /etc/systemd -cf /etc/systemd/network.backup.hypervisor.{{ hypervisor_networkd_backup_ts.stdout }}.tar network
  args:
    executable: /bin/bash
  changed_when: true
  when:
    - hypervisor_networking_cleanup | bool
    - networkd_unapproved_files | length > 0

- name: Remove non-approved networkd config files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ networkd_unapproved_files }}"
  when:
    - hypervisor_networking_cleanup | bool

- name: Stage bridge netdev
  ansible.builtin.template:
    src: bridge.netdev.j2
    dest: "{{ networkd_paths.bridge_netdev }}"
    owner: root
    group: root
    mode: "0644"
  register: bridge_netdev_result

- name: Stage bridge network
  ansible.builtin.template:
    src: bridge.network.j2
    dest: "{{ networkd_paths.bridge_network }}"
    owner: root
    group: root
    mode: "0644"
  register: bridge_network_result

- name: Stage server VLAN netdev
  ansible.builtin.template:
    src: vlan.netdev.j2
    dest: "{{ networkd_paths.vlan_netdev }}"
    owner: root
    group: root
    mode: "0644"
  register: vlan_netdev_result

- name: Stage server VLAN network (DHCP on VLAN subif)
  ansible.builtin.template:
    src: vlan.network.j2
    dest: "{{ networkd_paths.vlan_network }}"
    owner: root
    group: root
    mode: "0644"
  register: vlan_network_result

- name: Stage physical NIC network (enslave to bridge)
  ansible.builtin.template:
    src: phys.network.j2
    dest: "{{ networkd_paths.phys_network }}"
    owner: root
    group: root
    mode: "0644"
  register: phys_network_result

- name: Set hypervisor networking change fact
  ansible.builtin.set_fact:
    hypervisor_networking_changed: >-
      {{ bridge_netdev_result.changed
         or bridge_network_result.changed
         or vlan_netdev_result.changed
         or vlan_network_result.changed
         or phys_network_result.changed }}

- name: Check whether the bridge already exists
  ansible.builtin.stat:
    path: "/sys/class/net/{{ net_bridge_name }}"
  register: hypervisor_networking_bridge

- name: Check systemd-networkd state for the cutover decision
  ansible.builtin.systemd:
    name: systemd-networkd
  register: hypervisor_networking_networkd
  changed_when: false
  failed_when: false

- name: Decide whether the cutover still has to happen
  # Gating the cutover on "a template changed in this run" is a trap: staging
  # first (runbook Phase 3 step 1) consumes the change, so the later apply run
  # finds every file already correct, reports ok, and skips the entire cutover
  # with a green recap. The two-phase workflow could never complete that way.
  #
  # Decide from actual system state instead — the host has not been migrated
  # while systemd-networkd is inactive or the bridge does not exist — and keep
  # the changed check as well, so editing VLANs on an already-migrated host
  # still restarts networkd to pick them up.
  ansible.builtin.set_fact:
    hypervisor_networking_apply_needed: >-
      {{ (hypervisor_networking_networkd.status.ActiveState | default('unknown')) != 'active'
         or not hypervisor_networking_bridge.stat.exists
         or hypervisor_networking_changed | bool }}

- name: Display staged networkd paths
  ansible.builtin.debug:
    msg:
      - "Staged: {{ networkd_paths.bridge_netdev }}"
      - "Staged: {{ networkd_paths.bridge_network }}"
      - "Staged: {{ networkd_paths.vlan_netdev }}"
      - "Staged: {{ networkd_paths.vlan_network }}"
      - "Staged: {{ networkd_paths.phys_network }}"
      - "Apply is {{ 'enabled' if (hypervisor_networking_apply | bool) else 'disabled' }}."

- name: Take ownership from the legacy network stack
  # The single cutover. The bridge config is staged, so this is the moment
  # ifupdown/dhcpcd can be dismantled. Importing networkd's handoff rather than
  # letting networkd apply on its own is what keeps this to one
  # connection-breaking step instead of two.
  #
  # This is the point of no return without console access. Have out-of-band
  # console open before running with hypervisor_networking_apply=true.
  ansible.builtin.import_role:
    name: networkd
    tasks_from: handoff.yml
  when:
    - hypervisor_networking_apply | bool
    - hypervisor_networking_apply_needed | bool
  tags:
    - risky

- name: Start systemd-networkd on the new configuration
  # Inline rather than notified. A handler only runs when the notifying task
  # reported `changed`, which is the same trap the apply gate had: after a
  # staging run the templates are already correct, so nothing notifies and the
  # restart silently never happens. The cutover must not depend on whether a
  # file was rewritten in this particular run.
  #
  # async/poll:0 because this severs the connection Ansible is running over —
  # the host is moving its address to the VLAN subinterface, so there is no
  # reply to wait for.
  ansible.builtin.systemd:
    name: systemd-networkd
    enabled: true
    state: restarted
  async: 45
  poll: 0
  when:
    - hypervisor_networking_apply | bool
    - hypervisor_networking_apply_needed | bool
  tags:
    - risky

- name: Report that a reconnect is required
  ansible.builtin.debug:
    msg: >-
      Networking is being cut over on {{ inventory_hostname }}. The bridge MAC
      is pinned to {{ net_phys_iface }} and the DHCP client identifies by MAC,
      so the host is expected to keep the lease it already has — but that has
      not yet been proven across a real cutover, so be ready for the address to
      move once. Inventory targets the permanent FQDN either way, so no
      inventory edit is needed; allow a few seconds for DNS. If the host does
      not come back, recover from the console — there is no automatic rollback.
  when:
    - hypervisor_networking_apply | bool
    - hypervisor_networking_apply_needed | bool
  tags:
    - risky

- name: End play after the cutover
  ansible.builtin.meta: end_play
  when:
    - hypervisor_networking_apply | bool
    - hypervisor_networking_apply_needed | bool
  tags:
    - risky
