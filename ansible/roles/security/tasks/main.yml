---
- name: Enforce SSH daemon configuration (authoritative)
  # Replaces the whole file; see the template header for why patching the
  # file cloud-init leaves behind is not enough. `sshd -t` rejects a broken
  # config before it is installed, so a bad render cannot lock out SSH.
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd
- name: Lock root account
  ansible.builtin.user:
    name: root
    password_lock: true
  when: security_lock_root
