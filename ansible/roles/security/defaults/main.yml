---
# TODO: IPv6 firewall coverage required before this role is considered complete.
#
# The hypervisor-networking role configures the server VLAN subinterface with
# IPv6AcceptRA=yes. The host will acquire a SLAAC address and an IPv6 default
# route whenever a router on the server VLAN sends RAs. SSH hardening alone is
# insufficient once the host has a routable IPv6 address.
#
# When firewall tasks are added, rules must cover both IPv4 and IPv6.
# Use nftables inet/ip6 tables or ensure ufw has IPV6=yes with matching rules.

# Root's console password is the platform's break-glass credential — set by
# hand at install time (docs/hypervisor-bootstrap.md Step 3) and never
# touched by Ansible/git/vault. Locking it here would block console password
# login via PAM's account-phase check (pam_unix.so), the same mechanism
# documented in docs/cloud-init-bootstrap-sop.md for svc-ansible's
# lock_passwd pitfall — defeating the whole point of a break-glass account.
# Root is unconditionally blocked over SSH regardless of this setting, via
# PermitRootLogin no below. Set to true to lock root entirely and give up
# console break-glass access.
security_lock_root: false
security_ssh_allow_users:
  - svc-ansible
