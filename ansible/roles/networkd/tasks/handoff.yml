---
# Hand ownership of the host's networking from the legacy stack to
# systemd-networkd.
#
# Imported by this role's main.yml (standalone servers) and by
# hypervisor-networking (which supplies its own bridge config). Kept in its own
# file precisely so a second role can import it with `tasks_from: handoff.yml`
# at the moment its config is staged — that is what collapses the hypervisor
# path from two connection-breaking cutovers to one.
#
# PRECONDITIONS. The caller must have already:
#   1. staged the final .network/.netdev files
#   2. archived /etc/systemd/network and staged a rollback script
#   3. armed a dead-man switch that runs that script
# This file only tears the legacy stack down. The caller starts
# systemd-networkd and verifies, because the two callers do that differently:
# standalone verifies in-run, the hypervisor ends the play and verifies on the
# reconnect run.
#
# Self-contained by design: it detects what it needs rather than relying on
# facts the caller happened to set.

- name: Resolve the primary interface for the handoff
  # Normally set by this role's main.yml. Defaulted here so the file also works
  # when imported on its own, which is the whole point of it being importable.
  ansible.builtin.set_fact:
    networkd_primary_iface: >-
      {{ networkd_primary_iface | default(ansible_default_ipv4.interface) }}

- name: Check ifupdown networking service state
  ansible.builtin.systemd:
    name: networking
  register: networkd_ho_ifupdown
  changed_when: false
  failed_when: false

- name: Check NetworkManager service state
  ansible.builtin.systemd:
    name: NetworkManager
  register: networkd_ho_nm
  changed_when: false
  failed_when: false

- name: Check whether a dhcpcd process holds an interface
  # dhcpcd has no systemd unit on Debian 13 — ifup exec's the binary and it
  # re-parents to PID 1. `systemctl stop dhcpcd` is therefore a no-op here and
  # the process has to be signalled directly.
  ansible.builtin.command: pgrep -x dhcpcd
  register: networkd_ho_dhcpcd
  changed_when: false
  failed_when: false

- name: Report the legacy stack about to be dismantled
  # This is the input to an irreversible-without-rollback step, so it is worth
  # a line in the run output.
  ansible.builtin.debug:
    msg: >-
      networking={{ networkd_ho_ifupdown.status.ActiveState | default('absent') }}
      NetworkManager={{ networkd_ho_nm.status.ActiveState | default('absent') }}
      dhcpcd={{ 'running' if networkd_ho_dhcpcd.rc == 0 else 'stopped' }}

- name: Record what rollback has to put back
  # The dead-man script reads this to restore only what was actually taken
  # away. Re-enabling NetworkManager on a host that never ran it would be its
  # own outage.
  ansible.builtin.copy:
    dest: /etc/systemd/network.legacy-stack
    owner: root
    group: root
    mode: "0644"
    content: |
      {% if (networkd_ho_ifupdown.status.ActiveState | default('')) == 'active' %}
      networking
      {% endif %}
      {% if (networkd_ho_nm.status.ActiveState | default('')) == 'active' %}
      NetworkManager
      {% endif %}
      unmask-ifup

- name: Stop and disable NetworkManager
  ansible.builtin.systemd:
    name: NetworkManager
    state: stopped
    enabled: false
  failed_when: false
  when: (networkd_ho_nm.status.ActiveState | default('')) == 'active'

- name: Stop ifup instance for the primary interface
  # allow-hotplug interfaces are brought up by a udev-triggered
  # ifup@<iface>.service, not by networking.service. Disabling networking.service
  # alone leaves this path intact, which is how two managers end up on one NIC.
  ansible.builtin.systemd:
    name: "ifup@{{ networkd_primary_iface }}.service"
    state: stopped
  failed_when: false

- name: Mask the ifup template unit
  # Masking the template masks every instance, so udev cannot re-trigger ifup
  # on any interface while systemd-networkd owns the host. Rollback unmasks it.
  ansible.builtin.systemd:
    name: "ifup@.service"
    masked: true
  failed_when: false

- name: Stop and disable ifupdown networking service
  ansible.builtin.systemd:
    name: networking
    state: stopped
    enabled: false
  failed_when: false
  when: networkd_ho_ifupdown.status.ActiveState is defined

- name: Stop any running dhcpcd process
  # `dhcpcd -x` asks it to exit and release; pkill is the fallback for an
  # instance that will not. Failure is tolerated: if no dhcpcd is running the
  # whole point is already satisfied.
  ansible.builtin.shell: dhcpcd -x 2>/dev/null || pkill -x dhcpcd || true
  args:
    executable: /bin/bash
  changed_when: networkd_ho_dhcpcd.rc == 0
  failed_when: false
  when: networkd_ho_dhcpcd.rc == 0
