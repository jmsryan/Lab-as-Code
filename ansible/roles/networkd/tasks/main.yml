---
# Migrate a host from its legacy network stack to systemd-networkd.
#
# Staging is unconditional and safe. Nothing is stopped, started, masked, or
# restarted unless networkd_apply is true — see defaults/main.yml.
#
# The cutover has no automatic rollback. Recovery is an out-of-band console
# job; see the note at the top of hypervisor-networking/tasks/main.yml for why
# the dead-man switch that used to live here was removed.

- name: Gather network facts
  # Only the network subset. The previous version also pulled hardware,
  # virtual, and the entire package database to populate facts nothing read.
  ansible.builtin.setup:
    gather_subset:
      - network

- name: Assert a default IPv4 route exists
  ansible.builtin.assert:
    that:
      - ansible_default_ipv4 is defined
      - ansible_default_ipv4.interface is defined
    fail_msg: >-
      No default IPv4 route, so the primary interface cannot be identified.
      Refusing to migrate networking.

- name: Set primary interface
  # Resolved before the short-circuit below, so the fact is defined even on a
  # host that is already on networkd — hypervisor-networking imports
  # handoff.yml, which needs it, after this role may have ended early.
  ansible.builtin.set_fact:
    networkd_primary_iface: "{{ ansible_default_ipv4.interface }}"

- name: Check systemd-networkd unit is installed
  ansible.builtin.stat:
    path: /usr/lib/systemd/system/systemd-networkd.service
  register: networkd_unit

- name: Assert systemd-networkd is available
  ansible.builtin.assert:
    that:
      - networkd_unit.stat.exists
    fail_msg: >-
      systemd-networkd unit not found. Install it before running this role.

- name: Check systemd-networkd service state
  ansible.builtin.systemd:
    name: systemd-networkd
  register: networkd_service_state
  changed_when: false
  failed_when: false

- name: Determine whether systemd-networkd already owns the host
  ansible.builtin.set_fact:
    networkd_already_controlling: >-
      {{ (networkd_service_state.status.ActiveState | default('unknown')) == 'active' }}

- name: Report that migration is unnecessary
  ansible.builtin.debug:
    msg: systemd-networkd is already active. Nothing to migrate.
  when: networkd_already_controlling | bool

- name: End role when systemd-networkd already owns the host
  ansible.builtin.meta: end_role
  when: networkd_already_controlling | bool

- name: Check primary interface is not a bridge, bond, or VLAN
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "/sys/class/net/{{ networkd_primary_iface }}/bridge"
    - "/sys/class/net/{{ networkd_primary_iface }}/bonding"
    - "/proc/net/vlan/{{ networkd_primary_iface }}"
  register: networkd_primary_iface_kind
  loop_control:
    label: "{{ item }}"

- name: Assert primary interface is a physical NIC
  # Migrating while the default route already runs over a bridge or bond means
  # tearing down the thing carrying the connection this runs over.
  ansible.builtin.assert:
    that:
      - (networkd_primary_iface_kind.results | selectattr('stat.exists') | list | length) == 0
    fail_msg: >-
      {{ networkd_primary_iface }} is a bridge, bond, or VLAN, not a physical
      NIC. Refusing to proceed.

- name: Ensure /etc/systemd/network exists
  ansible.builtin.file:
    path: /etc/systemd/network
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Stage DHCP unit for the primary interface
  # Skipped when a caller supplies its own config (networkd_stage_primary:
  # false), so this role never writes a unit that competes with it.
  ansible.builtin.template:
    src: primary.network.j2
    dest: "/etc/systemd/network/10-{{ networkd_primary_iface }}.network"
    owner: root
    group: root
    mode: "0644"
  when: networkd_stage_primary | bool

- name: Apply — hand networking to systemd-networkd
  when: networkd_apply | bool
  tags:
    - risky
  block:
    - name: Take ownership from the legacy network stack
      ansible.builtin.import_tasks: handoff.yml

    - name: Enable and start systemd-networkd
      ansible.builtin.systemd:
        name: systemd-networkd
        enabled: true
        state: restarted

    - name: Wait for the primary interface to acquire an IPv4 address
      # Polls instead of sleeping a fixed interval, so a fast host is not
      # penalised and a slow lease is not called a failure prematurely.
      ansible.builtin.shell: >-
        set -o pipefail;
        ip -4 -o addr show dev {{ networkd_primary_iface }} scope global | awk '{print $4}'
      args:
        executable: /bin/bash
      register: networkd_post_addr
      until: (networkd_post_addr.stdout | trim) != ""
      retries: 20
      delay: 3
      changed_when: false
      failed_when: false

    - name: Check the default route runs over the primary interface
      ansible.builtin.shell: "set -o pipefail; ip route show default | awk '{print $5}'"
      args:
        executable: /bin/bash
      register: networkd_post_route
      changed_when: false
      failed_when: false

    - name: Assert networking is healthy after the handoff
      ansible.builtin.assert:
        that:
          - (networkd_post_addr.stdout | trim) != ""
          - (networkd_post_route.stdout | trim) == networkd_primary_iface
        fail_msg: >-
          Post-handoff verification failed.
          IPv4: '{{ networkd_post_addr.stdout | trim }}'
          Default route interface: '{{ networkd_post_route.stdout | trim }}'
          The legacy stack has already been dismantled and there is no
          automatic rollback. Recover from the out-of-band console.
        success_msg: >-
          systemd-networkd owns {{ networkd_primary_iface }} with IPv4
          {{ networkd_post_addr.stdout | trim }}.

    - name: Confirm Ansible can still reach the host
      ansible.builtin.wait_for_connection:
        timeout: 60

    - name: Migration committed
      ansible.builtin.debug:
        msg:
          - "systemd-networkd now owns networking."
          - "{{ networkd_primary_iface }}: {{ networkd_post_addr.stdout | trim }}"
